<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Taskoria Pixel Studio v5.0 - Import & Session Colors</title>
<style>
    :root {
        --bg-color: #121212;
        --panel-bg: #1a1a2e;
        --accent: #f0c040;
    }

    body {
        background-color: var(--bg-color);
        color: #eee;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
    }

    h1 { 
        margin-bottom: 5px; 
        font-size: clamp(16px, 4vw, 24px);
        text-transform: uppercase; 
        letter-spacing: 3px; 
        color: var(--accent);
        text-align: center;
    }

    p.subtitle { color: #aaa; font-size: 0.8rem; margin-top: 0; margin-bottom: 20px; text-align: center; }

    #main-layout {
        display: flex;
        gap: 20px;
        width: 100%;
        max-width: 1400px;
        justify-content: center;
        align-items: flex-start;
    }

    /* Lienzo de Dibujo */
    #image-wrapper {
        position: relative;
        width: 100%;
        max-width: 650px;
        aspect-ratio: 1 / 1;
        border: 4px solid #000;
        cursor: crosshair;
        touch-action: none;
        background-color: #12121e;
        box-shadow: 0 0 30px rgba(0,0,0,0.5);
        overflow: hidden;
    }
    #image-wrapper.checkerboard-bg {
        background-image: linear-gradient(45deg, #808080 25%, transparent 25%),
            linear-gradient(-45deg, #808080 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #808080 75%),
            linear-gradient(-45deg, transparent 75%, #808080 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        background-color: #c0c0c0;
    }

    #reference-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: 100%;
        background-position: 50% 50%;
        background-repeat: no-repeat;
        opacity: 0.5;
        pointer-events: none; 
        z-index: 1;
        image-rendering: pixelated; 
    }

    #grid-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: repeat(64, 1fr);
        grid-template-rows: repeat(64, 1fr);
        z-index: 2;
    }

    .grid-cell { border: 1px solid rgba(255, 255, 255, 0.02); box-sizing: border-box; }

    /* Paneles laterales */
    .panel {
        width: 100%;
        max-width: 300px;
        background-color: var(--panel-bg);
        border: 2px solid #333;
        border-radius: 8px;
        padding: 15px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 15px;
        flex-shrink: 0;
    }

    .panel-title {
        font-size: 0.9rem;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid #444;
        padding-bottom: 5px;
        display: flex;
        justify-content: space-between;
    }

    /* Paleta de Colores */
    #palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .swatch {
        width: 100%; aspect-ratio: 1/1; border: 2px solid transparent;
        border-radius: 4px; cursor: pointer; transition: transform 0.1s;
    }
    .swatch:hover { transform: scale(1.1); }
    .swatch.active { border-color: var(--accent); transform: scale(1.1); box-shadow: 0 0 10px rgba(240, 192, 64, 0.5); }
    .swatch.eraser { background-color: #333; position: relative; }
    .swatch.eraser::after { content: 'X'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 14px; font-weight: bold; }

    .custom-color-row { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: #aaa; }
    input[type="color"] { border: none; width: 35px; height: 35px; cursor: pointer; background: none; }

    .reference-tools {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #0a0a0c;
        padding: 10px;
        border-radius: 4px;
        border: 1px solid #333;
    }

    .reference-tools input[type="file"] { font-size: 0.7rem; color: #aaa; margin-bottom: 5px; }

    .slider-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.7rem;
        color: #aaa;
    }
    
    .slider-row label { width: 50px; }
    .slider-row input[type="range"] { flex-grow: 1; }

    .action-btn {
        background-color: var(--accent); color: #000; border: none; padding: 10px;
        border-radius: 4px; font-weight: bold; text-transform: uppercase; cursor: pointer;
        transition: background 0.2s; width: 100%; font-size: 0.8rem;
    }
    .action-btn:hover { background-color: #fff; }
    .action-btn.secondary { background-color: #333; color: #fff; }
    .action-btn.secondary:hover { background-color: #444; }

    input[type="text"] {
        width: 100%; padding: 8px; box-sizing: border-box; background: #0a0a0c;
        border: 1px solid #444; color: #fff; border-radius: 4px; font-family: monospace;
    }

    #session-gallery { display: flex; flex-direction: column; gap: 8px; max-height: 150px; overflow-y: auto; }
    .gallery-item {
        display: flex; justify-content: space-between; align-items: center;
        background: #0a0a0c; padding: 8px; border-radius: 4px; border: 1px solid #333;
    }
    .gallery-item span { font-family: monospace; font-size: 0.8rem; color: #8bc34a; }
    .gallery-actions button {
        background: #333; color: white; border: none; padding: 4px 8px; border-radius: 2px;
        cursor: pointer; font-size: 0.7rem; margin-left: 5px;
    }
    .gallery-actions button:hover { background: #555; }
    .gallery-actions button.del:hover { background: #e74c3c; }

    #code-output {
        width: 100%; height: 120px; background-color: #0a0a0c; border: 1px solid #444;
        color: #8bc34a; font-family: 'Courier New', Courier, monospace; font-size: 0.7rem;
        padding: 10px; box-sizing: border-box; border-radius: 4px; resize: none;
    }

    .export-group {
        display: flex;
        gap: 8px;
    }

    /* Colores de Sesión */
    #session-colors { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
    .session-swatch {
        width: 100%; aspect-ratio: 1/1; border: 2px solid #444;
        border-radius: 3px; cursor: pointer; transition: transform 0.1s, border-color 0.1s;
    }
    .session-swatch:hover { transform: scale(1.15); border-color: var(--accent); }

    .import-area {
        display: flex; flex-direction: column; gap: 8px;
    }

    /* Color de Fondo del Lienzo */
    .canvas-bg-row {
        display: flex; align-items: center; gap: 8px;
        justify-content: center; margin-top: 8px;
    }
    .canvas-bg-row label { font-size: 0.75rem; color: #aaa; }
    .bg-preset {
        width: 24px; height: 24px; border: 2px solid #444;
        border-radius: 3px; cursor: pointer; transition: transform 0.1s, border-color 0.1s;
    }
    .bg-preset:hover { transform: scale(1.15); border-color: var(--accent); }
    .bg-preset.active-bg { border-color: var(--accent); box-shadow: 0 0 6px rgba(240, 192, 64, 0.5); }
    .bg-preset.checkerboard {
        background-image: linear-gradient(45deg, #808080 25%, transparent 25%),
            linear-gradient(-45deg, #808080 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #808080 75%),
            linear-gradient(-45deg, transparent 75%, #808080 75%);
        background-size: 8px 8px;
        background-position: 0 0, 0 4px, 4px -4px, -4px 0px;
        background-color: #c0c0c0;
    }

    @media (max-width: 950px) {
        #main-layout { flex-direction: column; align-items: center; }
        .panel { max-width: 650px; }
    }
</style>
</head>
<body>

<header>
    <h1>Taskoria Pixel Studio v5.0</h1>
    <p class="subtitle">Import & Session Colors Edition</p>
</header>

<div id="main-layout">
    
    <aside class="panel">
        <div class="panel-title">Guía de Referencia</div>
        <div class="reference-tools">
            <input type="file" id="bg-upload" accept="image/*">
            <div class="slider-row"><label>Opacidad:</label><input type="range" id="bg-opacity" min="0" max="1" step="0.05" value="0.5"></div>
            <div class="slider-row"><label>Tamaño:</label><input type="range" id="bg-scale" min="10" max="1000" step="5" value="100"></div>
            <div class="slider-row"><label>Eje X:</label><input type="range" id="bg-x" min="0" max="100" step="0.5" value="50"></div>
            <div class="slider-row"><label>Eje Y:</label><input type="range" id="bg-y" min="0" max="100" step="0.5" value="50"></div>
            <button class="action-btn secondary" id="bg-clear" style="padding: 6px; font-size: 0.7rem;">Quitar Guía</button>
        </div>

        <div class="panel-title" style="margin-top: 10px;">Pinceles</div>
        <div id="palette">
            <div class="swatch active" style="background-color: #000000;" data-color="#000000"></div>
            <div class="swatch" style="background-color: #ffdbac;" data-color="#ffdbac"></div>
            <div class="swatch" style="background-color: #567194;" data-color="#567194"></div>
            <div class="swatch" style="background-color: #3a4e69;" data-color="#3a4e69"></div>
            <div class="swatch" style="background-color: #253347;" data-color="#253347"></div>
            <div class="swatch" style="background-color: #bdc3c7;" data-color="#bdc3c7"></div>
            <div class="swatch" style="background-color: #7f8c8d;" data-color="#7f8c8d"></div>
            <div class="swatch" style="background-color: #ffffff;" data-color="#ffffff"></div>
            <div class="swatch" style="background-color: #5d4037;" data-color="#5d4037"></div>
            <div class="swatch" style="background-color: #f1c40f;" data-color="#f1c40f"></div>
            <div class="swatch" style="background-color: #2e8b57;" data-color="#2e8b57"></div>
            <div class="swatch" style="background-color: #8b0000;" data-color="#8b0000"></div>
            <div class="swatch" style="background-color: #8a2be2;" data-color="#8a2be2"></div>
            <div class="swatch eraser" data-color="transparent"></div>
        </div>

        <div class="custom-color-row">
            <input type="color" id="custom-color" value="#ff0000">
            <span>Color personalizado</span>
        </div>

        <div class="panel-title" style="margin-top: 10px;">
            <span>Colores de Sesión</span>
            <span id="session-colors-count" style="color:#aaa;">0</span>
        </div>
        <div id="session-colors">
            <p id="session-colors-empty" style="font-size: 0.7rem; color: #666; text-align: center; margin: 0; grid-column: 1/-1;">Pinta para añadir colores.</p>
        </div>

        <div class="panel-title" style="margin-top: 10px;">Espejo</div>
        <div class="export-group">
            <button class="action-btn secondary" id="mirror-h-btn">&#8596; Horizontal</button>
            <button class="action-btn secondary" id="mirror-v-btn">&#8597; Vertical</button>
        </div>

        <button class="action-btn secondary" id="clear-btn">Limpiar Lienzo</button>
    </aside>

    <div style="display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 650px;">
        <main id="image-wrapper">
            <div id="reference-layer"></div>
            <div id="grid-overlay"></div>
        </main>
        <div class="canvas-bg-row">
            <label>Fondo:</label>
            <div class="bg-preset active-bg" data-bg="#12121e" style="background-color: #12121e;" title="Oscuro (defecto)"></div>
            <div class="bg-preset" data-bg="#ffffff" style="background-color: #ffffff;" title="Blanco"></div>
            <div class="bg-preset" data-bg="#000000" style="background-color: #000000;" title="Negro"></div>
            <div class="bg-preset" data-bg="#2c2c2c" style="background-color: #2c2c2c;" title="Gris oscuro"></div>
            <div class="bg-preset" data-bg="#808080" style="background-color: #808080;" title="Gris"></div>
            <div class="bg-preset checkerboard" data-bg="checkerboard" title="Transparencia"></div>
            <input type="color" id="canvas-bg-custom" value="#12121e" title="Color personalizado" style="width: 28px; height: 28px; padding: 0; border: 2px solid #444; border-radius: 3px; cursor: pointer; background: none;">
        </div>
    </div>

    <aside class="panel">
        <div class="panel-title">Guardar Personaje</div>
        <input type="text" id="char-name" placeholder="Nombre del archivo...">
        <button class="action-btn" id="save-btn">Guardar en Sesión</button>
        
        <div class="panel-title" style="margin-top: 10px;">Exportar Imagen</div>
        <div class="export-group">
            <button class="action-btn" id="export-png-btn" style="background-color: #2196F3;">PNG</button>
            <button class="action-btn" id="export-svg-btn" style="background-color: #9c27b0;">SVG</button>
        </div>

        <div class="panel-title" style="margin-top: 10px;">
            <span>Sesión Actual</span>
            <span id="session-count" style="color:#aaa;">0</span>
        </div>
        <div id="session-gallery">
            <p style="font-size: 0.7rem; color: #666; text-align: center; margin: 0;">Vacío.</p>
        </div>

        <div class="panel-title" style="margin-top: 10px;">Importar JSON</div>
        <div class="import-area">
            <input type="file" id="import-json-file" accept=".json" style="font-size: 0.7rem; color: #aaa;">
            <button class="action-btn" id="import-json-btn" style="background-color: #ff9800;">Importar Archivo</button>
        </div>

        <div class="panel-title" style="margin-top: 10px;">Exportar JSON</div>
        <div class="export-group">
            <button class="action-btn" id="generate-btn" style="background-color: #8bc34a;">Código</button>
            <button class="action-btn" id="export-json-btn" style="background-color: #4CAF50;">Archivo</button>
        </div>
        <textarea id="code-output" readonly placeholder="JSON aquí..."></textarea>
    </aside>

</div>

<script>
    const gridSize = 64;
    const gridOverlay = document.getElementById('grid-overlay');
    const palette = document.getElementById('palette');
    const customColorInput = document.getElementById('custom-color');
    const clearBtn = document.getElementById('clear-btn');
    
    // Referencias
    const bgUpload = document.getElementById('bg-upload');
    const bgOpacity = document.getElementById('bg-opacity');
    const bgScale = document.getElementById('bg-scale');
    const bgX = document.getElementById('bg-x');
    const bgY = document.getElementById('bg-y');
    const refLayer = document.getElementById('reference-layer');
    const bgClear = document.getElementById('bg-clear');

    // Sesión y Export
    const charNameInput = document.getElementById('char-name');
    const saveBtn = document.getElementById('save-btn');
    const sessionGallery = document.getElementById('session-gallery');
    const sessionCount = document.getElementById('session-count');
    const generateBtn = document.getElementById('generate-btn');
    const exportJsonBtn = document.getElementById('export-json-btn');
    const codeOutput = document.getElementById('code-output');
    const exportPngBtn = document.getElementById('export-png-btn');
    const exportSvgBtn = document.getElementById('export-svg-btn');

    const importJsonFile = document.getElementById('import-json-file');
    const importJsonBtn = document.getElementById('import-json-btn');
    const sessionColorsContainer = document.getElementById('session-colors');
    const sessionColorsCount = document.getElementById('session-colors-count');
    const sessionColorsEmpty = document.getElementById('session-colors-empty');

    const canvasBgCustom = document.getElementById('canvas-bg-custom');
    const imageWrapper = document.getElementById('image-wrapper');
    const bgPresets = document.querySelectorAll('.bg-preset');

    let currentColor = "#000000";
    let canvasBgColor = '#12121e';
    let isDrawing = false;
    let pixelBuffer = new Array(gridSize * gridSize).fill('transparent');
    const cells = [];
    let sessionDrawings = {};
    const sessionColors = new Set();

    // 0. LÓGICA DE REFERENCIA
    function updateReferenceTransform() {
        refLayer.style.opacity = bgOpacity.value;
        refLayer.style.backgroundSize = `${bgScale.value}%`;
        refLayer.style.backgroundPosition = `${bgX.value}% ${bgY.value}%`;
    }

    bgUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                refLayer.style.backgroundImage = `url(${event.target.result})`;
                bgScale.value = 100; bgX.value = 50; bgY.value = 50;
                updateReferenceTransform();
            }
            reader.readAsDataURL(file);
        }
    });

    [bgOpacity, bgScale, bgX, bgY].forEach(el => el.addEventListener('input', updateReferenceTransform));
    bgClear.addEventListener('click', () => { refLayer.style.backgroundImage = 'none'; bgUpload.value = ''; });

    // CANVAS BACKGROUND
    function setCanvasBg(value) {
        canvasBgColor = value;
        imageWrapper.classList.remove('checkerboard-bg');
        if (value === 'checkerboard') {
            imageWrapper.classList.add('checkerboard-bg');
            imageWrapper.style.backgroundColor = '';
        } else {
            imageWrapper.style.backgroundColor = value;
        }
        bgPresets.forEach(p => p.classList.toggle('active-bg', p.dataset.bg === value));
    }

    bgPresets.forEach(preset => {
        preset.addEventListener('click', () => setCanvasBg(preset.dataset.bg));
    });

    canvasBgCustom.addEventListener('input', (e) => {
        bgPresets.forEach(p => p.classList.remove('active-bg'));
        canvasBgColor = e.target.value;
        imageWrapper.classList.remove('checkerboard-bg');
        imageWrapper.style.backgroundColor = e.target.value;
    });

    // SESSION COLORS
    function addSessionColor(color) {
        if (color === 'transparent' || sessionColors.has(color)) return;
        sessionColors.add(color);
        sessionColorsCount.textContent = sessionColors.size;
        if (sessionColorsEmpty) sessionColorsEmpty.remove();
        const swatch = document.createElement('div');
        swatch.className = 'session-swatch';
        swatch.style.backgroundColor = color;
        swatch.title = color;
        swatch.addEventListener('click', () => {
            currentColor = color;
            document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        });
        sessionColorsContainer.appendChild(swatch);
    }

    function rebuildSessionColors() {
        sessionColors.clear();
        sessionColorsContainer.innerHTML = '';
        const allColors = new Set();
        pixelBuffer.forEach(c => { if (c !== 'transparent') allColors.add(c); });
        Object.values(sessionDrawings).forEach(buf => {
            buf.forEach(c => { if (c !== 'transparent') allColors.add(c); });
        });
        if (allColors.size === 0) {
            sessionColorsCount.textContent = '0';
            sessionColorsContainer.innerHTML = '<p id="session-colors-empty" style="font-size: 0.7rem; color: #666; text-align: center; margin: 0; grid-column: 1/-1;">Pinta para añadir colores.</p>';
            return;
        }
        allColors.forEach(c => addSessionColor(c));
    }

    // 1. GENERAR CUADRÍCULA
    for (let i = 0; i < gridSize * gridSize; i++) {
        const cell = document.createElement('div');
        cell.classList.add('grid-cell');
        cell.dataset.index = i;
        gridOverlay.appendChild(cell);
        cells.push(cell);

        const paint = () => {
            cell.style.backgroundColor = currentColor;
            pixelBuffer[i] = currentColor;
            addSessionColor(currentColor);
        };

        cell.addEventListener('pointerenter', () => { if (isDrawing) paint(); });
        cell.addEventListener('pointerdown', (e) => {
            isDrawing = true; paint(); cell.releasePointerCapture(e.pointerId);
        });
    }

    window.addEventListener('pointerup', () => { isDrawing = false; });

    // 2. PALETA Y HERRAMIENTAS
    palette.addEventListener('click', (e) => {
        const swatch = e.target;
        if (!swatch.classList.contains('swatch')) return;
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        currentColor = swatch.dataset.color;
    });

    customColorInput.addEventListener('input', (e) => {
        currentColor = e.target.value;
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    });

    function renderBufferToScreen() {
        cells.forEach((cell, i) => { cell.style.backgroundColor = pixelBuffer[i]; });
    }

    clearBtn.addEventListener('click', () => {
        if(confirm('¿Limpiar lienzo?')) {
            pixelBuffer.fill('transparent');
            renderBufferToScreen();
        }
    });

    // ESPEJO
    document.getElementById('mirror-h-btn').addEventListener('click', () => {
        const newBuffer = new Array(gridSize * gridSize);
        for (let y = 0; y < gridSize; y++) {
            for (let x = 0; x < gridSize; x++) {
                newBuffer[y * gridSize + x] = pixelBuffer[y * gridSize + (gridSize - 1 - x)];
            }
        }
        pixelBuffer = newBuffer;
        renderBufferToScreen();
    });

    document.getElementById('mirror-v-btn').addEventListener('click', () => {
        const newBuffer = new Array(gridSize * gridSize);
        for (let y = 0; y < gridSize; y++) {
            for (let x = 0; x < gridSize; x++) {
                newBuffer[y * gridSize + x] = pixelBuffer[(gridSize - 1 - y) * gridSize + x];
            }
        }
        pixelBuffer = newBuffer;
        renderBufferToScreen();
    });

    // 3. GESTIÓN DE SESIÓN
    function updateGalleryUI() {
        const keys = Object.keys(sessionDrawings);
        sessionCount.textContent = keys.length;
        if (keys.length === 0) {
            sessionGallery.innerHTML = '<p style="font-size: 0.7rem; color: #666; text-align: center;">Vacío.</p>';
            return;
        }
        sessionGallery.innerHTML = '';
        keys.forEach(name => {
            const div = document.createElement('div');
            div.className = 'gallery-item';
            div.innerHTML = `<span>${name}</span><div class="gallery-actions"></div>`;
            
            const loadBtn = document.createElement('button');
            loadBtn.textContent = '✎';
            loadBtn.onclick = () => {
                pixelBuffer = [...sessionDrawings[name]]; 
                renderBufferToScreen();
                charNameInput.value = name;
            };

            const delBtn = document.createElement('button');
            delBtn.textContent = 'X';
            delBtn.className = 'del';
            delBtn.onclick = () => { delete sessionDrawings[name]; updateGalleryUI(); };

            div.querySelector('.gallery-actions').appendChild(loadBtn);
            div.querySelector('.gallery-actions').appendChild(delBtn);
            sessionGallery.appendChild(div);
        });
    }

    saveBtn.addEventListener('click', () => {
        let name = charNameInput.value.trim() || "sprite_" + Date.now().toString().slice(-4);
        charNameInput.value = name;
        sessionDrawings[name] = [...pixelBuffer];
        updateGalleryUI();
    });

    // 4. EXPORTACIÓN A IMAGEN (PNG & SVG)
    exportPngBtn.addEventListener('click', () => {
        const canvas = document.createElement('canvas');
        canvas.width = gridSize; canvas.height = gridSize;
        const ctx = canvas.getContext('2d');
        if (canvasBgColor !== 'checkerboard' && canvasBgColor !== '#12121e') {
            ctx.fillStyle = canvasBgColor;
            ctx.fillRect(0, 0, gridSize, gridSize);
        }
        pixelBuffer.forEach((color, i) => {
            if (color !== 'transparent') {
                ctx.fillStyle = color;
                ctx.fillRect(i % gridSize, Math.floor(i / gridSize), 1, 1);
            }
        });
        const link = document.createElement('a');
        link.download = `${charNameInput.value || 'pixelart'}.png`;
        link.href = canvas.toDataURL();
        link.click();
    });

    exportSvgBtn.addEventListener('click', () => {
        let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${gridSize} ${gridSize}" shape-rendering="crispEdges">`;
        if (canvasBgColor !== 'checkerboard' && canvasBgColor !== '#12121e') {
            svg += `<rect width="${gridSize}" height="${gridSize}" fill="${canvasBgColor}"/>`;
        }
        pixelBuffer.forEach((color, i) => {
            if (color !== 'transparent') {
                svg += `<rect x="${i % gridSize}" y="${Math.floor(i / gridSize)}" width="1" height="1" fill="${color}"/>`;
            }
        });
        svg += `</svg>`;
        const blob = new Blob([svg], {type: 'image/svg+xml'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${charNameInput.value || 'pixelart'}.svg`;
        link.click();
        URL.revokeObjectURL(url);
    });

    // 5. EXPORTACIÓN JSON
    function getExportData() {
        const exportData = {};
        if (Object.keys(sessionDrawings).length === 0) {
            exportData["current"] = pixelBuffer;
        } else {
            Object.assign(exportData, sessionDrawings);
        }
        return exportData;
    }

    generateBtn.addEventListener('click', () => {
        codeOutput.value = JSON.stringify(getExportData());
    });

    exportJsonBtn.addEventListener('click', () => {
        const jsonString = JSON.stringify(getExportData(), null, 2);
        const blob = new Blob([jsonString], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${charNameInput.value || 'pixelart_session'}.json`;
        link.click();
        URL.revokeObjectURL(url);
    });

    // 6. IMPORTAR JSON
    importJsonBtn.addEventListener('click', () => { importJsonFile.click(); });

    importJsonFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            try {
                const data = JSON.parse(event.target.result);
                if (typeof data !== 'object' || Array.isArray(data)) {
                    alert('Formato JSON no válido. Se espera un objeto con sprites.');
                    return;
                }
                const keys = Object.keys(data);
                if (keys.length === 0) {
                    alert('El archivo JSON está vacío.');
                    return;
                }
                for (const key of keys) {
                    if (!Array.isArray(data[key]) || data[key].length !== gridSize * gridSize) {
                        alert(`El sprite "${key}" no tiene el formato correcto (se esperan ${gridSize * gridSize} píxeles).`);
                        return;
                    }
                }
                sessionDrawings = {};
                keys.forEach(name => { sessionDrawings[name] = [...data[name]]; });
                const firstName = keys[0];
                pixelBuffer = [...sessionDrawings[firstName]];
                renderBufferToScreen();
                charNameInput.value = firstName;
                updateGalleryUI();
                rebuildSessionColors();
                codeOutput.value = '';
            } catch (err) {
                alert('Error al leer el archivo JSON: ' + err.message);
            }
        };
        reader.readAsText(file);
        importJsonFile.value = '';
    });

</script>
</body>
</html>
